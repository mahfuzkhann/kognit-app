# Continuous integration. NOTHING here needs a live provider key or a real Supabase project:
# every provider call is the deterministic MockProvider, the database tests run against a
# throwaway PostgreSQL service, and the dummy environment values below are inert placeholders.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GEMINI_API_KEY: ci-not-a-real-key
  SUPABASE_URL: https://ci.invalid
  SUPABASE_ANON_KEY: ci-not-a-real-key

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Smoke suite
        run: python -m pytest -q kognit_smoke_test.py
      - name: Compile check
        run: python -m compileall -q backend evaluation
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Migration / schema consistency
        run: python -m pytest -q test_schema_contract.py
      - name: Log and secret hygiene (no secrets or student text in logs/tracked files)
        run: |
          python -m pytest -q test_p1_hardening.py test_usage_telemetry_integrity.py
          ! git grep -nE "AIza[0-9A-Za-z_-]{30,}|sb_secret_[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY" -- . ':!*.md' ':!test_*' ':!supabase/tests'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests_frontend/package-lock.json
      - name: JavaScript syntax
        run: |
          for f in static/js/*.js static/sw.js; do node --check "$f"; done
      - name: jsdom suites
        working-directory: tests_frontend
        run: |
          npm ci
          for t in test_*.mjs; do echo "== $t"; node "$t" || exit 1; done
        # NOTE: the real-browser (puppeteer) suites are not part of CI; see docs/AI_ENGINE_2_0.md.

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration twice-safe and run the SQL behaviour + concurrency tests
        run: bash supabase/tests/run_local_db_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Python database behaviour test (uses the same server)
        run: python -m pytest -q test_database_behaviour.py