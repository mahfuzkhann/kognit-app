<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kognit - AI Academic Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Noto Sans Bengali: proper Bengali script shaping (conjuncts, matras).
         The previous font stack (-apple-system/Segoe UI/Roboto) has no
         Bengali coverage at all, so the browser fell back to whichever
         generic system font happens to support Bengali - inconsistent
         across OS/browser and prone to broken/disconnected conjunct
         rendering. Noto Sans Bengali is Google's purpose-built font for
         correct complex-script shaping and includes full Latin coverage
         too, so it's safe to use as the single font for mixed
         Bangla+English content (see style.css line ~5). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown Parser Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- MathJax Configuration — MUST be loaded before the MathJax script below.
         Enables $...$ and \(...\) for inline math, and $$...$$ / \[...\] for
         display math. MathJax v3 does NOT enable $...$ by default. -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                // BUG FIX (Bangla formula text breaking): MathJax's built-in
                // fonts have no Bengali coverage/shaping at all, so any
                // Bangla text that ends up inside math mode - even properly
                // wrapped in \text{...} - renders with broken conjuncts.
                // This makes \text{...} inherit the surrounding page font
                // (Noto Sans Bengali, see the <link> above) instead of
                // MathJax's own fonts. This is a second line of defense;
                // the primary fix is the AI prompt in ai_engine.py now
                // instructing Gemini not to put Bangla inside math
                // delimiters at all - this covers cases where it still does.
                mtextInheritFont: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            svg: {
                fontCache: 'none'
            }
        };
    </script>

    <!-- LaTeX Math Rendering.
         Using SVG output (tex-svg.js) instead of CHTML (tex-mml-chtml.js):
         CHTML relies on nested custom elements, ::before/::after pseudo-elements,
         and web-font glyphs for stretchy symbols, which html2canvas (used by
         html2pdf.js for PDF export) does not reliably capture, producing broken/
         overlapping equations in exported PDFs. SVG output is pure vector paths
         and renders correctly under html2canvas, while looking visually the same
         as CHTML in normal browser chat rendering.

         fontCache history for this project:
         - 'global' (MathJax default): caused equations to render BLANK/MISSING
            in PDF export. All glyphs are stored once in a shared page-level
            <defs>, referenced elsewhere via <use href="#...">. html2canvas
            captures elements largely in isolation and could not reliably
            resolve those cross-element references once the shared defs block
            was outside the captured region.
         - 'local': fixed the blank-equation issue (each equation carries its
            own <defs>+<use> pair, self-contained), but caused equations to
            render as solid BLACK BOXES instead. <defs> content is not supposed
            to render on its own per the SVG spec, but html2canvas does not
            fully respect that — it can paint the raw glyph <path> sitting
            inside <defs> directly (default black fill, positioned at the SVG
            origin), on top of/behind the correctly-positioned <use> copy.
         - 'none' (current): MathJax skips <defs>/<use> entirely and inlines
            each glyph as a direct <path> at its correct position. There is no
            template block left for html2canvas to misinterpret. This is the
            standard fix for MathJax SVG output combined with canvas-based
            rasterizers/screenshot tools. Slightly larger SVG payload per
            equation (paths aren't shared/referenced), which is irrelevant at
            chat-message scale.

         NOTE (PDF export removal): the PDF export feature that motivated the
         SVG-vs-CHTML and fontCache choices above has been removed from the
         MVP (see backend/main.py and static/js/app.js — the export endpoint
         and exportChatToPDF/svgToPngDataUrl code paths are gone). This
         MathJax configuration is left unchanged because it also renders
         correctly for normal on-screen chat, and normal chat rendering must
         not be touched. -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="btn-primary" onclick="createNewProject()">+ New Project</button>
            <button class="btn-secondary" onclick="createStandaloneChat()">+ New Chat</button>
            <button class="btn-quiz" onclick="openQuizModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg> Take Quiz Test</button>
        </div>

        <div class="sidebar-search-container">
            <div class="search-input-wrapper">
                <span class="search-input-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                <input type="text" id="sidebar-search-input" placeholder="Search projects or chats..." onkeyup="handleSidebarSearch(event)">
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">Projects &amp; Conversations</div>
            <div id="history-list" class="history-list">
                <!-- Dynamic Projects & Chats render here -->
            </div>
        </div>

        <!-- AUTH / USER SECTION -->
        <div class="sidebar-footer">
            <div id="auth-guest-view">
                <button class="btn-auth-login" onclick="openAuthModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg> Login / Sign Up</button>
            </div>
            <div id="auth-logged-view" class="user-profile-bar hidden">
                <div class="user-info">
                    <span id="user-display-email" class="user-email-text"></span>
                </div>
                <button id="logout-btn" class="btn-auth-logout" onclick="handleLogout()" title="Logout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
            </div>
        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="navbar">
            <div class="brand">
                <div class="logo-text">Kognit</div>
                <div class="tagline">Personalized AI Academic Assistant</div>
            </div>

            <div class="context-selector">
                <select id="board-select" class="context-dropdown" onchange="handleContextSettingChange('board', 'board-select')">
                    <option value="BD NCTB (Bangla)">BD NCTB (Bangla)</option>
                    <option value="BD NCTB (English Version)">BD NCTB (English Version)</option>
                    <option value="Edexcel / Cambridge (O/A Level)">Edexcel / Cambridge (O/A Level)</option>
                </select>

                <select id="class-select" class="context-dropdown" onchange="handleContextSettingChange('user_class', 'class-select')">
                    <option value="Class 9-10 (SSC)">Class 9-10 (SSC)</option>
                    <option value="Class 11-12 (HSC)">Class 11-12 (HSC)</option>
                    <option value="Class 6-8">Class 6-8</option>
                </select>

                <select id="stream-select" class="context-dropdown" onchange="handleContextSettingChange('stream', 'stream-select')">
                    <option value="Science (বিজ্ঞান)">Science (বিজ্ঞান)</option>
                    <option value="Commerce (ব্যবসায় শিক্ষা)">Commerce (ব্যবসায় শিক্ষা)</option>
                    <option value="Arts (মানবিক)">Arts (মানবিক)</option>
                </select>
            </div>

            <div class="export-share-bar">
                <button class="export-btn share-btn" onclick="shareChatLink()" title="Share Link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg> Share</button>
            </div>
        </header>

        <!-- MODE SWITCHER -->
        <div class="mode-selector">
            <button id="btn-direct" class="mode-btn active" onclick="setMode('direct')">Direct Answer</button>
            <button id="btn-socratic" class="mode-btn" onclick="setMode('socratic')">Help Me Solve (Socratic)</button>
        </div>

        <!-- CHAT AREA -->
        <div id="chat-box" class="chat-box">
            <!-- Dynamic chat messages render here -->
        </div>

        <!-- PREVIEW / STATUS BARS -->
        <div id="pdf-status-bar" class="image-preview-bar hidden">
            <span class="pdf-status-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></span>
            <span id="pdf-status-text">PDF Active</span>
            <button class="remove-attachment-btn" onclick="clearPDFContext()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>

        <div id="image-preview-bar" class="image-preview-bar hidden">
            <div class="preview-wrapper">
                <img id="image-preview-img" src="" alt="Selected Preview">
                <button class="remove-img-btn" onclick="clearSelectedImage()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <span class="preview-text">Image attached</span>
        </div>

        <!-- INPUT BAR -->
        <div class="input-container">
            <!-- PHASE 4: unified "+" composer action menu.
                 Replaces the two separate PDF/Image icon buttons that used
                 to sit directly in the input bar. The hidden <input
                 type="file"> elements below are the SAME elements/ids as
                 before with the SAME onchange handlers (handlePDFUpload /
                 handleImageSelect in app.js, unchanged) - only their
                 visible trigger changed, from a <label for="..."> wrapping
                 an icon button, to a JS-driven .click() call from a menu
                 item (see triggerComposerPDFUpload / triggerComposerImageUpload
                 in app.js). No new upload pipeline was created. -->
            <div class="composer-attach-wrapper">
                <button type="button" id="composer-plus-btn" class="composer-plus-btn"
                        title="Add attachment" aria-haspopup="true" aria-expanded="false"
                        aria-controls="composer-menu" onclick="toggleComposerMenu(event)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>

                <div id="composer-menu" class="composer-menu hidden" role="menu" aria-label="Composer actions">
                    <button type="button" class="composer-menu-item" role="menuitem" onclick="triggerComposerPDFUpload()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span>Upload File</span>
                    </button>

                    <button type="button" class="composer-menu-item" role="menuitem" onclick="triggerComposerImageUpload()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <span>Upload Image</span>
                    </button>

                    <button type="button" class="composer-menu-item" role="menuitem" disabled aria-disabled="true" title="Coming soon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path></svg>
                        <span>Add to Project</span>
                        <span class="composer-menu-badge">Coming soon</span>
                    </button>

                    <button type="button" class="composer-menu-item" role="menuitem" disabled aria-disabled="true" title="Coming soon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
                        <span>Create Image</span>
                        <span class="composer-menu-badge">Coming soon</span>
                    </button>
                </div>

                <input type="file" id="pdf-input" accept=".pdf" onchange="handlePDFUpload(event)" hidden>
                <input type="file" id="image-input" accept="image/*" onchange="handleImageSelect(event)" hidden>
            </div>

            <textarea id="user-input" placeholder="Ask about your book, notes, or problem..." onkeydown="handleKeyDown(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </main>
</div>

<!-- AUTH MODAL -->
<div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card auth-card">
        <div class="modal-header">
            <h2 id="auth-modal-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span id="auth-modal-title-text">Sign In to Kognit</span></h2>
            <button class="close-modal-btn" onclick="closeAuthModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>

        <div id="auth-error-msg" class="auth-error-msg hidden"></div>

        <button class="btn-google-auth" onclick="handleGoogleSignIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Continue with Google
        </button>

        <div class="auth-divider"><span>OR</span></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth-email-input" placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password-input" placeholder="••••••••">
        </div>

        <div class="auth-action-btns">
            <button id="auth-submit-btn" class="btn-primary" onclick="handleEmailAuth('login')">Sign In</button>
        </div>

        <div class="auth-toggle-text">
            <span id="auth-toggle-desc">Don't have an account?</span>
            <a href="javascript:void(0)" id="auth-toggle-link" onclick="toggleAuthMode()">Sign Up</a>
        </div>
    </div>
</div>

<!-- QUIZ MODAL -->
<div id="quiz-modal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg><span>Generate AI Practice Test</span></h2>
            <button class="close-modal-btn" onclick="closeQuizModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>

        <!-- QUIZ SETUP VIEW -->
        <div id="quiz-setup-view" class="modal-body">
            <p class="modal-desc">Test your understanding based on your curriculum.</p>

            <div class="form-group">
                <label>Topic / Chapter Name</label>
                <input type="text" id="quiz-topic-input" placeholder="e.g., Force & Motion, Cell Structure">
            </div>

            <div class="form-group">
                <label>Number of Questions</label>
                <select id="quiz-count-select">
                    <option value="5">5 Questions (Quick Test)</option>
                    <option value="10" selected>10 Questions (Standard)</option>
                    <option value="15">15 Questions (Full Assessment)</option>
                </select>
            </div>

            <button class="start-quiz-btn" onclick="generateAndStartQuiz()">Generate Quiz with AI</button>
        </div>

        <!-- QUIZ ACTIVE VIEW -->
        <div id="quiz-active-view" class="modal-body hidden">
            <div class="quiz-progress-bar" id="quiz-progress-text">Question 1 of 5</div>
            <div id="quiz-question-container"></div>
            <button id="quiz-next-btn" class="start-quiz-btn" onclick="nextQuizQuestion()">Next Question</button>
        </div>

        <!-- QUIZ RESULT VIEW -->
        <div id="quiz-result-view" class="modal-body hidden">
            <div class="result-summary">
                <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M7 5H4a3 3 0 0 0 3 5"></path><path d="M17 5h3a3 3 0 0 1-3 5"></path></svg><span>Quiz Completed!</span></h2>
                <div id="result-score-text" class="score-text">Your Score: 0 / 5</div>
            </div>
            <div id="result-details-list" class="result-details-list"></div>
            <button class="start-quiz-btn" onclick="resetQuizModal()">Try Another Test</button>
        </div>
    </div>
</div>

<!-- JS (unchanged) -->
<script src="/static/js/app.js"></script>
</body>
</html>
